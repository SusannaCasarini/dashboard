<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendario Shout 2027</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="logo.png">
  <!--
    CALENDARIO SHOUT 2027 (modello)
    build/calendario.js mette al posto del segnaposto EVENTI (nello script in fondo) l'elenco degli impegni del weekend
    letti dal foglio "Calendario Shout". Pagina pubblica: niente note, niente allenamenti.
  -->
  <style>
    :root {
      color-scheme: dark;
      --sfondo: #0f1420; --carta: #182032; --carta2: #1f2a40;
      --testo: #e8ecf3; --grigio: #9aa4b5; --bordo: #2a3448;
      --naz: #38bdf8;    --naz-bg: rgba(56,189,248,.20);
      --shout: #f87171;  --shout-bg: rgba(239,68,68,.24);
      --evento: #facc15; --evento-bg: rgba(250,204,21,.20);
      --all: #4ade80;    --all-bg: rgba(74,222,128,.14);
      --pod: #c084fc;    --pod-bg: rgba(192,132,252,.18);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px; background: var(--sfondo); color: var(--testo); }
    .contenitore { max-width: 1100px; margin: 0 auto; padding: 16px 16px 48px; }
    a { color: inherit; }
    .torna { color: var(--grigio); font-size: 14px; text-decoration: none; display: inline-block; padding: 8px 0; }
    .testata { display: flex; align-items: center; gap: 16px; margin: 4px 0 18px; }
    .testata img { width: 72px; height: 72px; flex: none; filter: drop-shadow(0 4px 14px rgba(200,22,26,.35)); }
    .testata .sotto { margin-bottom: 0; }
    h1 { font-family: Georgia, 'Times New Roman', serif; font-weight: 400; font-size: clamp(32px, 7.5vw, 50px);
      line-height: 1.08; margin: 4px 0 6px; letter-spacing: -.01em; }
    h1 em { font-style: normal; color: var(--shout); }
    .sotto { color: var(--grigio); font-size: 14px; margin-bottom: 18px; }

    /* Prossimo impegno */
    .prossimo { display: flex; gap: 16px; align-items: center; background: var(--carta); border: 1px solid var(--bordo);
      border-left: 5px solid var(--c); border-radius: 14px; padding: 16px 18px; margin-bottom: 18px; }
    .prossimo .eti { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--grigio); }
    .prossimo .tit { font-size: 22px; font-weight: 700; margin: 2px 0; }
    .prossimo .dt { color: var(--grigio); font-size: 15px; }
    .prossimo .tra { margin-left: auto; text-align: center; min-width: 76px; }
    .prossimo .tra b { display: block; font-size: 34px; line-height: 1; color: var(--c); font-family: Georgia, serif; font-weight: 400; }
    .prossimo .tra span { font-size: 12px; color: var(--grigio); }

    /* Comandi: filtri + vista */
    .comandi { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .filtri { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 999px;
      border: 1px solid var(--bordo); background: var(--carta2); color: var(--testo); font: inherit; font-size: 15px; cursor: pointer; }
    .chip .pallino { width: 12px; height: 12px; border-radius: 50%; background: var(--c); }
    .chip[aria-pressed="false"] { opacity: .45; }
    .chip[aria-pressed="false"] .pallino { background: transparent; border: 2px solid var(--c); }
    .vista { display: inline-flex; background: var(--carta2); border: 1px solid var(--bordo); border-radius: 12px; padding: 3px; }
    .vista button { min-height: 40px; padding: 0 16px; border: 0; border-radius: 9px; background: none; color: var(--grigio);
      font: inherit; font-size: 15px; cursor: pointer; }
    .vista button[aria-pressed="true"] { background: var(--carta); color: var(--testo); font-weight: 600; }

    /* Vista mesi */
    .mesi { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
    .mese { background: var(--carta); border: 1px solid var(--bordo); border-radius: 14px; padding: 14px; }
    .mese h2 { font-family: Georgia, serif; font-weight: 400; font-size: 22px; margin: 0 0 10px; text-transform: capitalize; }
    .griglia { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; }
    .griglia .gs { font-size: 11px; color: var(--grigio); padding: 2px 0 4px; }
    .griglia .gs.we { color: var(--testo); }
    .g { aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; border-radius: 8px;
      font-size: 14px; color: var(--grigio); position: relative; }
    .g.we { color: var(--testo); }
    .g.ev { background: var(--bg); color: var(--c); font-weight: 700; }
    .g.ev.dc { background: none; border: 2px dashed var(--c); }
    .g.oggi::after { content: ""; position: absolute; inset: -2px; border: 2px solid var(--testo); border-radius: 9px; }
    .g.passato { opacity: .35; }
    .g[data-k] { cursor: pointer; }
    .g.al { background: var(--bg); color: var(--c); font-weight: 600; }
    .g.pod::before { content: "P"; position: absolute; top: 1px; right: 4px; font-size: 10px; font-weight: 800; color: var(--c); }
    .g.scelto { outline: 2px solid var(--testo); outline-offset: 1px; }
    .dettaglio { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--carta2); font-size: 14px;
      border-left: 4px solid var(--c); }
    .dettaglio b { color: var(--c); }
    .legenda-all { display: flex; flex-wrap: wrap; gap: 6px 18px; background: var(--carta); border: 1px solid var(--bordo);
      border-radius: 12px; padding: 10px 14px; margin-bottom: 16px; font-size: 14px; color: var(--grigio); }
    .legenda-all b { color: var(--testo); font-weight: 600; }
    .legenda-all .q { display: inline-block; width: 18px; height: 18px; border-radius: 5px; vertical-align: -4px; margin-right: 6px;
      background: var(--bg); border: 1px solid var(--c); position: relative; }
    .legenda-all .q.p::after { content: "P"; position: absolute; top: -1px; right: 2px; font-size: 9px; font-weight: 800; color: var(--c); }
    .lista-mese { list-style: none; margin: 12px 0 0; padding: 0; border-top: 1px solid var(--bordo); }
    .lista-mese:empty { display: none; }
    .vuoto { color: var(--grigio); font-size: 14px; margin: 10px 0 0; }

    /* Riga evento (usata nei mesi e nell'elenco) */
    .ev-riga { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--bordo); }
    .ev-riga:last-child { border-bottom: 0; }
    .ev-riga .barra { width: 5px; align-self: stretch; border-radius: 3px; background: var(--c); flex: none; }
    .ev-riga .quando { min-width: 92px; white-space: nowrap; font-size: 14px; color: var(--grigio); }
    .ev-riga .quando b { display: block; color: var(--testo); font-size: 15px; }
    .ev-riga .cosa { font-weight: 600; font-size: 16px; }
    .ev-riga .tipo { font-size: 13px; color: var(--c); font-weight: 600; }
    .tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
      border: 1px dashed var(--grigio); color: var(--grigio); margin-left: 6px; vertical-align: 2px; }
    .ev-riga.passato { opacity: .4; }

    .elenco { background: var(--carta); border: 1px solid var(--bordo); border-radius: 14px; padding: 4px 16px 8px; }
    .elenco h3 { font-family: Georgia, serif; font-weight: 400; font-size: 20px; margin: 16px 0 2px; text-transform: capitalize; color: var(--grigio); }

    .piede { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
      color: var(--grigio); font-size: 13px; }
    .scarica { min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--naz); background: none;
      color: var(--testo); font: inherit; font-size: 15px; cursor: pointer; }
    [hidden] { display: none !important; }

    /* Pagine: Calendario / Palestra */
    .pagine { display: flex; gap: 4px; border-bottom: 1px solid var(--bordo); margin: 0 0 18px; }
    .pagine a { flex: 0 0 auto; min-height: 48px; display: flex; align-items: center; padding: 0 18px; text-decoration: none;
      color: var(--grigio); font-weight: 600; font-size: 16px; border-bottom: 3px solid transparent; margin-bottom: -1px; }
    .pagine a[aria-selected="true"] { color: var(--testo); border-bottom-color: var(--shout); }

    /* Palestra */
    .schede-nav { display: flex; width: 100%; margin-bottom: 16px; overflow-x: auto; }
    .schede-nav button { flex: 1; white-space: nowrap; }
    .scheda { background: var(--carta); border: 1px solid var(--bordo); border-radius: 14px; padding: 6px 18px 14px; }
    .scheda-testa { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap;
      padding: 12px 0 6px; }
    .scheda-testa h2 { font-family: Georgia, serif; font-weight: 400; font-size: 26px; margin: 0; }
    .luogo { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--bg); color: var(--c); }
    .blocco { padding: 14px 0 4px; border-top: 1px solid var(--bordo); }
    .blocco:first-of-type { border-top: 0; }
    .blocco h3 { margin: 0 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--shout); }
    .blocco .nota { color: var(--grigio); font-size: 14px; margin: 2px 0 6px; }
    .es { display: grid; grid-template-columns: 1fr auto auto; gap: 6px 12px; align-items: center; padding: 9px 0;
      border-bottom: 1px dashed var(--bordo); }
    .es:last-child { border-bottom: 0; }
    .es .n { font-size: 16px; font-weight: 500; }
    .pill { font-size: 14px; font-weight: 700; padding: 4px 10px; border-radius: 8px; background: var(--carta2); white-space: nowrap;
      font-variant-numeric: tabular-nums; }
    .pill.rec { font-weight: 500; color: var(--grigio); background: none; border: 1px solid var(--bordo); }
    .pill.rec::before { content: "⏱ "; }
    .palestra-piede { color: var(--grigio); font-size: 13px; margin-top: 14px; }

    /* Colori dei blocchi di esercizi */
    .blocco { --c: var(--shout); }
    .blocco h3 { color: var(--c); border-left: 4px solid var(--c); padding-left: 10px; margin-left: -2px; }

    /* Pesi e Andamento */
    .riquadro { background: var(--carta); border: 1px solid var(--bordo); border-radius: 14px; padding: 16px 18px; margin-bottom: 14px; }
    .riquadro h2 { font-family: Georgia, serif; font-weight: 400; font-size: 24px; margin: 0 0 6px; }
    .campo { display: flex; flex-direction: column; gap: 6px; margin: 12px 0; font-size: 14px; color: var(--grigio); }
    .campo select, .campo input, .es-kg input, .data-allen input {
      min-height: 44px; border-radius: 10px; border: 1px solid var(--bordo); background: var(--carta2); color: var(--testo);
      font: inherit; font-size: 16px; padding: 0 12px; }
    .bottone { min-height: 48px; width: 100%; border-radius: 12px; border: 0; background: var(--shout); color: #1b0b0b;
      font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 6px; }
    .bottone:disabled { opacity: .6; cursor: wait; }
    .msg { font-size: 14px; margin-top: 10px; min-height: 20px; }
    .msg.err { color: var(--shout); }
    .msg.ok { color: var(--all); }
    .ciao { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
    .ciao b { font-size: 18px; }
    .link { background: none; border: 0; color: var(--grigio); font: inherit; font-size: 14px; text-decoration: underline; cursor: pointer; min-height: 44px; }
    .data-allen { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 14px; color: var(--grigio); flex-wrap: wrap; }
    .es-kg { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--bordo); }
    .es-kg:last-child { border-bottom: 0; }
    .es-kg .n { flex: 1; font-size: 16px; font-weight: 500; }
    .es-kg .n small { display: block; font-size: 13px; color: var(--grigio); font-weight: 400; margin-top: 2px; }
    .stepper { display: flex; align-items: center; gap: 4px; flex: none; }
    .stepper button { width: 40px; height: 44px; border-radius: 10px; border: 1px solid var(--bordo); background: var(--carta2);
      color: var(--testo); font-size: 20px; cursor: pointer; }
    .stepper input { width: 64px; text-align: center; padding: 0 4px; }
    .stepper span { font-size: 13px; color: var(--grigio); margin-left: 2px; }
    .andamento-es { background: var(--carta); border: 1px solid var(--bordo); border-left: 4px solid var(--c); border-radius: 0 14px 14px 0;
      padding: 12px 16px; margin-bottom: 10px; cursor: pointer; }
    .andamento-es .testa { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .andamento-es .testa b { font-size: 16px; }
    .andamento-es .num { font-size: 15px; white-space: nowrap; }
    .andamento-es .num strong { color: var(--c); font-size: 18px; }
    .andamento-es .info { font-size: 13px; color: var(--grigio); margin-top: 2px; }
    .andamento-es svg { display: block; width: 100%; height: 44px; margin-top: 6px; }
    .andamento-es .storia { margin-top: 8px; border-top: 1px solid var(--bordo); }
    .andamento-es .storia div { display: flex; justify-content: space-between; font-size: 14px; padding: 6px 0; border-bottom: 1px solid var(--bordo); }
    .andamento-es .storia div:last-child { border-bottom: 0; }
    .andamento-es .storia em { font-style: normal; color: var(--grigio); font-size: 12px; margin-left: 6px; }
    .vecchio { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--bordo); color: var(--grigio); font-weight: 400; }

    @media (max-width: 600px) {
      .contenitore { padding: 12px 12px 40px; }
      .testata { gap: 12px; } .testata img { width: 56px; height: 56px; }
      .testata h1 { font-size: 27px; }
      .pagine a { flex: 1; justify-content: center; padding: 0 4px; font-size: 14px; }
      .stepper button { width: 36px; } .stepper input { width: 56px; }
      .es { grid-template-columns: 1fr auto; }
      .es .n { grid-column: 1 / -1; }
      .es { grid-template-columns: auto auto 1fr; }
      .es .pill { justify-self: start; }
      .schede-nav button { padding: 0 10px; font-size: 14px; }
      .mesi { grid-template-columns: 1fr; }
      .prossimo .tit { font-size: 19px; }
      .comandi { flex-direction: column; align-items: stretch; }
      .vista { align-self: stretch; } .vista button { flex: 1; }
      .chip { flex: 1 1 auto; justify-content: center; }
    }
  </style>
</head>
<body>
<div class="contenitore">
  <header class="testata">
    <img src="logo.png" alt="Logo Shout">
    <div>
      <h1 id="titolo">Calendario <em>Shout</em> 2027</h1>
      <div class="sotto" id="sottotitolo">Impegni da gennaio a settembre</div>
    </div>
  </header>

  <nav class="pagine" role="tablist">
    <a href="#calendario" role="tab" data-pagina="calendario">Calendario</a>
    <a href="#palestra" role="tab" data-pagina="palestra">Palestra</a>
    <a href="#pesi" role="tab" data-pagina="pesi" hidden>I miei pesi</a>
    <a href="#andamento" role="tab" data-pagina="andamento" hidden>Andamento</a>
  </nav>

  <section id="pag-palestra" hidden>
    <div class="vista schede-nav" role="group" aria-label="Scheda" id="schede-nav"></div>
    <div id="scheda"></div>
  </section>

  <section id="pag-pesi" hidden></section>
  <section id="pag-andamento" hidden></section>

  <section id="pag-calendario">
  <div id="prossimo"></div>

  <div class="comandi">
    <div class="filtri" id="filtri"></div>
    <div class="vista" role="group" aria-label="Vista">
      <button data-vista="elenco" aria-pressed="true">Elenco</button>
      <button data-vista="mesi" aria-pressed="false">Calendario</button>
    </div>
  </div>

  <div id="elenco" class="elenco"></div>
  <div id="legenda-all" class="legenda-all" hidden>
    <span><span class="q" style="--c:var(--all);--bg:var(--all-bg)"></span><b>Allenamenti</b> dall'11 gennaio: lun e mar 19:30–21:30 al Battiferro · gio 21:00–23:00 al CUSB</span>
    <span>Tocca un giorno per i dettagli</span>
  </div>
  <div id="mesi" class="mesi" hidden></div>

  <div class="piede">
    <span>Le date tratteggiate sono da confermare.</span>
    <button class="scarica" id="ics">📅 Aggiungi al mio calendario (.ics)</button>
  </div>
  </section>
</div>

<script>
  const EVENTI = __EVENTI__;
  const ALLENAMENTI = __ALLENAMENTI__;
  const PALESTRA = __PALESTRA__;
  // orari e luoghi degli allenamenti per giorno della settimana (1 = lunedì, 2 = martedì, 4 = giovedì)
  const ORARI = { 1: '19:30–21:30 · Battiferro', 2: '19:30–21:30 · Battiferro', 4: '21:00–23:00 · CUSB' };
  const TIPI = {
    nazionale: { nome: 'Nazionale', c: 'var(--naz)', bg: 'var(--naz-bg)' },
    shout:     { nome: 'Shout',     c: 'var(--shout)', bg: 'var(--shout-bg)' },
    evento:    { nome: 'Eventi e tornei', c: 'var(--evento)', bg: 'var(--evento-bg)' },
    allenamento: { nome: 'Allenamenti', c: 'var(--all)', bg: 'var(--all-bg)', solo: 'mesi' },
    pod:       { nome: 'Pod / pausa', c: 'var(--pod)', bg: 'var(--pod-bg)', solo: 'mesi' },
  };
  const MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
  const GS = ['L','M','M','G','V','S','D'];
  const GIORNI = ['dom','lun','mar','mer','gio','ven','sab'];
  const attivi = new Set(['nazionale','shout','evento','allenamento','pod']);
  let vista = 'elenco';

  const data = (s) => { const [a,m,g] = s.split('-').map(Number); return new Date(a, m - 1, g); };
  const oggi = new Date(); oggi.setHours(0,0,0,0);
  const iso = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const OGGI = iso(oggi);

  // "23–24 gen" oppure "sab 30 gen"
  function quando(e, lungo) {
    const a = data(e.inizio), b = data(e.fine);
    const m = (d) => lungo ? MESI[d.getMonth()] : MESI[d.getMonth()].slice(0,3);
    if (e.inizio === e.fine) return `${GIORNI[a.getDay()]} ${a.getDate()} ${m(a)}`;
    if (a.getMonth() === b.getMonth()) return `${a.getDate()}–${b.getDate()} ${m(a)}`;
    return `${a.getDate()} ${m(a)} – ${b.getDate()} ${m(b)}`;
  }
  const visibili = () => EVENTI.filter(e => attivi.has(e.tipo));
  const passato = (e) => e.fine < OGGI;

  function riga(e) {
    const t = TIPI[e.tipo];
    const a = data(e.inizio);
    const giorni = e.inizio === e.fine ? GIORNI[a.getDay()] : `${GIORNI[a.getDay()]}–${GIORNI[data(e.fine).getDay()]}`;
    return `<li class="ev-riga${passato(e) ? ' passato' : ''}" style="--c:${t.c}">
      <span class="barra"></span>
      <span class="quando"><b>${e.inizio === e.fine ? `${a.getDate()} ${MESI[a.getMonth()].slice(0,3)}` : quando(e)}</b>${giorni}${e.orario ? '<br>' + e.orario : ''}</span>
      <span><div class="cosa">${e.titolo}${e.daConfermare ? '<span class="tag">da confermare</span>' : ''}</div>
      <div class="tipo">${t.nome}</div></span></li>`;
  }

  function disegnaProssimo() {
    const e = EVENTI.find(x => x.fine >= OGGI);
    const box = document.getElementById('prossimo');
    if (!e) { box.innerHTML = ''; return; }
    const t = TIPI[e.tipo];
    const n = Math.round((data(e.inizio) - oggi) / 86400000);
    box.innerHTML = `<div class="prossimo" style="--c:${t.c}">
      <div><div class="eti">Prossimo impegno · ${t.nome}</div>
      <div class="tit">${e.titolo}${e.daConfermare ? '<span class="tag">da confermare</span>' : ''}</div>
      <div class="dt">${quando(e, true)}${e.orario ? ' · ' + e.orario : ''}</div></div>
      <div class="tra">${n <= 0 ? '<b>oggi</b>' : `<b>${n}</b><span>${n === 1 ? 'giorno' : 'giorni'}</span>`}</div></div>`;
  }

  function disegnaFiltri() {
    document.getElementById('filtri').innerHTML = Object.entries(TIPI)
      .filter(([k, t]) => (EVENTI.some(e => e.tipo === k) && !t.solo) || (t.solo === vista && ALLENAMENTI.some(a => a.tipo === k)))
      .map(([k, t]) => `<button class="chip" data-tipo="${k}" aria-pressed="${attivi.has(k)}" style="--c:${t.c}">
        <span class="pallino"></span>${t.nome}</button>`).join('');
  }

  function disegnaMesi() {
    const ev = visibili();
    // giorno → evento
    const perGiorno = {};
    for (const e of ev) for (let d = data(e.inizio); iso(d) <= e.fine; d.setDate(d.getDate() + 1)) perGiorno[iso(d)] ??= e;
    const allen = {};
    for (const a of ALLENAMENTI) if (attivi.has(a.tipo)) allen[a.data] = a;
    let html = '';
    for (let m = 0; m <= 8; m++) {
      const primo = new Date(2027, m, 1), ultimo = new Date(2027, m + 1, 0).getDate();
      const vuote = (primo.getDay() + 6) % 7;     // lunedì = 0
      let celle = GS.map((g, i) => `<div class="gs${i >= 5 ? ' we' : ''}">${g}</div>`).join('');
      celle += '<div></div>'.repeat(vuote);
      for (let g = 1; g <= ultimo; g++) {
        const d = new Date(2027, m, g), k = iso(d), e = perGiorno[k], a = e ? null : allen[k];
        const we = d.getDay() === 0 || d.getDay() === 6;
        const cls = ['g', we && 'we', e && 'ev', e && e.daConfermare && 'dc', a && 'al', a && a.tipo === 'pod' && 'pod',
          k === OGGI && 'oggi', k < OGGI && 'passato'].filter(Boolean).join(' ');
        const t = e ? TIPI[e.tipo] : a ? TIPI[a.tipo] : null;
        const st = t ? ` data-k="${k}" style="--c:${t.c};--bg:${t.bg}"` : '';
        celle += `<div class="${cls}"${st}>${g}</div>`;
      }
      const delMese = ev.filter(e => data(e.inizio).getMonth() === m || data(e.fine).getMonth() === m);
      html += `<section class="mese"><h2>${MESI[m]}</h2><div class="griglia">${celle}</div><div class="dettaglio" hidden></div>
        ${delMese.length ? `<ul class="lista-mese">${delMese.map(riga).join('')}</ul>` : '<p class="vuoto">Nessun impegno</p>'}</section>`;
    }
    document.getElementById('mesi').innerHTML = html;
  }

  function disegnaElenco() {
    let html = '', mese = -1;
    for (const e of visibili()) {
      const m = data(e.inizio).getMonth();
      if (m !== mese) { if (mese >= 0) html += '</ul>'; html += `<h3>${MESI[m]}</h3><ul class="lista-mese" style="border:0;margin:0">`; mese = m; }
      html += riga(e);
    }
    document.getElementById('elenco').innerHTML = html + (mese >= 0 ? '</ul>' : '<p class="vuoto">Nessun impegno</p>');
  }

  function disegna() { disegnaFiltri(); disegnaMesi(); disegnaElenco(); }

  document.getElementById('filtri').addEventListener('click', (ev) => {
    const b = ev.target.closest('.chip'); if (!b) return;
    const k = b.dataset.tipo;
    attivi.has(k) ? attivi.delete(k) : attivi.add(k);
    disegna();
  });
  document.querySelectorAll('.vista button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.vista button').forEach(x => x.setAttribute('aria-pressed', x === b));
    vista = b.dataset.vista;
    document.getElementById('mesi').hidden = vista !== 'mesi';
    document.getElementById('legenda-all').hidden = vista !== 'mesi';
    document.getElementById('elenco').hidden = vista !== 'elenco';
    disegnaFiltri();
  }));

  // Tocco su un giorno colorato: mostra cosa c'è quel giorno sotto la griglia del mese
  document.getElementById('mesi').addEventListener('click', (ev) => {
    const c = ev.target.closest('.g[data-k]'); if (!c) return;
    const k = c.dataset.k, d = data(k), box = c.closest('.mese').querySelector('.dettaglio');
    document.querySelectorAll('.g.scelto').forEach(x => x.classList.remove('scelto'));
    const e = visibili().find(x => x.inizio <= k && k <= x.fine);
    const a = ALLENAMENTI.find(x => x.data === k);
    let testo, t;
    if (e) { t = TIPI[e.tipo]; testo = `<b>${e.titolo}</b>${e.orario ? ' ' + e.orario : ''}${e.daConfermare ? ' · da confermare' : ''} · ${t.nome}`; }
    else if (a) { t = TIPI[a.tipo]; testo = a.tipo === 'pod' ? `<b>Pod / pausa</b>` : `<b>Allenamento</b> ${ORARI[d.getDay()] || ''}`; }
    else return;
    c.classList.add('scelto');
    box.style.setProperty('--c', t.c);
    box.innerHTML = `${GIORNI[d.getDay()]} ${d.getDate()} ${MESI[d.getMonth()]} · ${testo}`;
    box.hidden = false;
  });

  // File .ics con gli impegni visibili, da aprire con Google Calendar / Calendario iPhone
  document.getElementById('ics').addEventListener('click', () => {
    const f = (s) => s.replace(/-/g, '');
    const fineEsclusa = (s) => { const d = data(s); d.setDate(d.getDate() + 1); return f(iso(d)); };
    const righe = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//BFD//Calendario Shout 2027//IT','CALSCALE:GREGORIAN'];
    visibili().forEach((e, i) => righe.push('BEGIN:VEVENT', `UID:shout2027-${i}-${f(e.inizio)}@bfd`,
      `DTSTAMP:${f(OGGI)}T000000Z`, `DTSTART;VALUE=DATE:${f(e.inizio)}`, `DTEND;VALUE=DATE:${fineEsclusa(e.fine)}`,
      `SUMMARY:${e.titolo}${e.orario ? ' ' + e.orario : ''}${e.daConfermare ? ' (da confermare)' : ''}`, `CATEGORIES:${TIPI[e.tipo].nome}`, 'END:VEVENT'));
    righe.push('END:VCALENDAR');
    const url = URL.createObjectURL(new Blob([righe.join('\r\n')], { type: 'text/calendar' }));
    const a = Object.assign(document.createElement('a'), { href: url, download: 'calendario-shout-2027.ics' });
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  });

  // Colore di ogni blocco di esercizi (Mobilità, Core, Plyo…)
  const COLORI_BLOCCO = { 'mobilità': '#9aa4b5', 'core': '#2dd4bf', 'plyo': '#fbbf24', 'power': '#fb923c', 'strength': '#f87171',
    'comp. e acc.': '#a78bfa', 'warm up': '#4ade80', 'andature': '#38bdf8', 'run': '#f472b6' };
  const coloreBlocco = (nome) => COLORI_BLOCCO[String(nome).toLowerCase()] || '#9aa4b5';

  // ===== PALESTRA =====
  let schedaScelta = PALESTRA.schede[0].id;
  function disegnaPalestra() {
    document.getElementById('schede-nav').innerHTML = PALESTRA.schede.map(sc =>
      `<button data-scheda="${sc.id}" aria-pressed="${sc.id === schedaScelta}">${sc.breve}</button>`).join('');
    const sc = PALESTRA.schede.find(x => x.id === schedaScelta);
    const luogo = sc.luogo === 'campo'
      ? '<span class="luogo" style="--c:var(--all);--bg:var(--all-bg)">In campo</span>'
      : '<span class="luogo" style="--c:var(--naz);--bg:var(--naz-bg)">In palestra</span>';
    document.getElementById('scheda').innerHTML = `<article class="scheda">
      <div class="scheda-testa"><h2>${sc.titolo}</h2>${luogo}</div>
      ${sc.blocchi.map(b => `<div class="blocco" style="--c:${coloreBlocco(b.nome)}"><h3>${b.nome}</h3>${b.nota ? `<div class="nota">${b.nota}</div>` : ''}
        ${b.esercizi.map(e => `<div class="es"><span class="n">${e.nome}</span><span class="pill">${e.serie}</span>${e.rec ? `<span class="pill rec">${e.rec}</span>` : '<span></span>'}</div>`).join('')}
      </div>`).join('')}</article>
      <p class="palestra-piede">${PALESTRA.programma.nome}. Serie x ripetizioni, ⏱ = recupero.</p>`;
  }
  document.getElementById('schede-nav').addEventListener('click', (ev) => {
    const b = ev.target.closest('button'); if (!b) return;
    schedaScelta = b.dataset.scheda; disegnaPalestra();
  });

  // ===== CAMBIO PAGINA (dall'indirizzo: #calendario oppure #palestra) =====
  const SOTTOTITOLO = document.getElementById('sottotitolo').textContent;
  const PAGINE = {
    calendario: ['Calendario <em>Shout</em> 2027', SOTTOTITOLO],
    palestra:   ['Palestra <em>Shout</em>', 'Schede di forza e preparazione atletica'],
    pesi:       ['I miei <em>pesi</em>', 'Segna i carichi di oggi'],
    andamento:  ['Il mio <em>andamento</em>', 'Tutti i tuoi esercizi e i pesi fatti finora'],
  };
  function mostraPagina() {
    let pag = location.hash.slice(1);
    if (!PAGINE[pag] || ((pag === 'pesi' || pag === 'andamento') && !PESI_URL)) pag = 'calendario';
    for (const k of Object.keys(PAGINE)) document.getElementById('pag-' + k).hidden = k !== pag;
    document.querySelectorAll('.pagine a').forEach(a => a.setAttribute('aria-selected', a.dataset.pagina === pag));
    document.getElementById('titolo').innerHTML = PAGINE[pag][0];
    document.getElementById('sottotitolo').textContent = PAGINE[pag][1];
    if (pag === 'pesi') disegnaPesi();
    if (pag === 'andamento') disegnaAndamento();
  }
  window.addEventListener('hashchange', mostraPagina);

  // ===== PESI E ANDAMENTO =====
  // I pesi stanno in un foglio Google: la pagina li chiede a uno script Google (PESI_URL) con nome + PIN.
  const PESI_URL = __PESI_URL__;
  const esc = (t) => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const kgTesto = (n) => String(Math.round(n * 100) / 100).replace('.', ',');
  const dataBreve = (s) => { const d = data(s); return `${d.getDate()} ${MESI[d.getMonth()].slice(0, 3)}${d.getFullYear() !== oggi.getFullYear() ? ' ' + d.getFullYear() : ''}`; };
  // memoria del telefono (nome + PIN), così si inserisce una volta sola
  const memoria = {
    leggi() { try { return JSON.parse(localStorage.getItem('shout-pesi') || 'null'); } catch (e) { return null; } },
    scrivi(v) { try { v ? localStorage.setItem('shout-pesi', JSON.stringify(v)) : localStorage.removeItem('shout-pesi'); } catch (e) {} },
  };
  let utente = memoria.leggi();      // { atleta, pin }
  let storico = null;                // righe salvate dall'atleta
  let elencoAtlete = null;
  let schedaPesi = null;
  let aperti = new Set();

  async function chiama(dati) {
    const r = await fetch(PESI_URL, { method: 'POST', body: JSON.stringify(dati) });
    return r.json();
  }
  async function caricaStorico() {
    const r = await chiama({ azione: 'storico', atleta: utente.atleta, pin: utente.pin });
    if (!r.ok) throw new Error(r.errore);
    storico = r.righe;
  }
  // ultima volta per ogni esercizio: { chiave: {data, kg} }
  function ultimi() {
    const u = {};
    for (const r of storico || []) if (!u[r.chiave] || r.data >= u[r.chiave].data) u[r.chiave] = r;
    return u;
  }
  function esci() { utente = null; storico = null; memoria.scrivi(null); mostraPagina(); }

  // Schermata "Chi sei?" (uguale per Pesi e Andamento)
  async function disegnaAccesso(box) {
    box.innerHTML = `<div class="riquadro"><h2>Chi sei?</h2>
      <div class="nota" style="color:var(--grigio)">Scegli il tuo nome e scrivi il tuo PIN. Il telefono se lo ricorda.</div>
      <label class="campo">Nome<select id="acc-nome"><option value="">Caricamento…</option></select></label>
      <label class="campo">PIN<input id="acc-pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="4 cifre"></label>
      <button class="bottone" id="acc-entra">Entra</button><div class="msg err" id="acc-msg"></div></div>`;
    const sel = box.querySelector('#acc-nome'), msg = box.querySelector('#acc-msg'), pin = box.querySelector('#acc-pin');
    try {
      if (!elencoAtlete) { const r = await (await fetch(PESI_URL + '?azione=atlete')).json(); elencoAtlete = r.atlete || []; }
      sel.innerHTML = '<option value="">Scegli il tuo nome</option>' + elencoAtlete.map(n => `<option>${esc(n)}</option>`).join('');
    } catch (e) { msg.textContent = 'Non riesco a collegarmi. Controlla la connessione e ricarica la pagina.'; }
    sel.onchange = pin.oninput = () => msg.textContent = '';
    box.querySelector('#acc-entra').onclick = async (ev) => {
      if (!sel.value) { msg.textContent = 'Scegli il tuo nome'; return; }
      if (!/^\d{4}$/.test(pin.value)) { msg.textContent = 'Il PIN ha 4 cifre'; return; }
      ev.target.disabled = true; ev.target.textContent = 'Controllo…';
      try {
        const r = await chiama({ azione: 'login', atleta: sel.value, pin: pin.value });
        if (!r.ok) throw new Error(r.errore);
        utente = { atleta: sel.value, pin: pin.value }; memoria.scrivi(utente);
        mostraPagina();
      } catch (e) { msg.textContent = e.message || 'Errore di collegamento'; ev.target.disabled = false; ev.target.textContent = 'Entra'; }
    };
  }
  const intestazione = () => `<div class="ciao"><span>Ciao <b>${esc(utente.atleta)}</b></span><button class="link" data-esci>Non sei tu? Esci</button></div>`;

  async function preparaUtente(box) {
    if (!utente) { disegnaAccesso(box); return false; }
    if (!storico) {
      box.innerHTML = '<div class="riquadro">Caricamento…</div>';
      try { await caricaStorico(); }
      catch (e) {
        if (/PIN|Troppi/.test(e.message || '')) { utente = null; memoria.scrivi(null); disegnaAccesso(box); return false; }
        box.innerHTML = `<div class="riquadro"><div class="msg err">Non riesco a caricare i tuoi dati. Controlla la connessione e riprova.</div></div>`; return false;
      }
    }
    return true;
  }

  // Pagina "I miei pesi"
  async function disegnaPesi() {
    const box = document.getElementById('pag-pesi');
    if (!await preparaUtente(box)) return;
    const schede = PALESTRA.schede.filter(sc => sc.blocchi.some(b => b.esercizi.some(e => e.carico)));
    if (!schedaPesi || !schede.find(x => x.id === schedaPesi)) schedaPesi = schede[0].id;
    const sc = schede.find(x => x.id === schedaPesi);
    const u = ultimi();
    const min = iso(new Date(oggi.getFullYear(), oggi.getMonth(), oggi.getDate() - 14));
    box.innerHTML = intestazione() + `
      <div class="vista schede-nav" role="group">${schede.map(x => `<button data-sp="${x.id}" aria-pressed="${x.id === schedaPesi}">${x.breve}</button>`).join('')}</div>
      <div class="riquadro">
        <label class="data-allen">Allenamento del <input type="date" id="pesi-data" value="${OGGI}" min="${min}" max="${OGGI}"></label>
        ${sc.blocchi.filter(b => b.esercizi.some(e => e.carico)).map(b => `<div class="blocco" style="--c:${coloreBlocco(b.nome)}"><h3>${b.nome}</h3>
          ${b.esercizi.filter(e => e.carico).map(e => {
            const ult = u[e.chiave];
            const passo = /manubri|kettlebell/i.test(e.notaPeso || '') ? 2 : 2.5;
            return `<div class="es-kg"><span class="n">${esc(e.nome)}<small>${e.serie}${e.notaPeso ? ' · ' + e.notaPeso : ''}${ult ? ` · ultima ${kgTesto(ult.kg)} kg` : ''}</small></span>
              <span class="stepper"><button type="button" data-passo="-${passo}" aria-label="meno">−</button>
              <input inputmode="decimal" data-chiave="${e.chiave}" data-nome="${esc(e.nome)}" data-ultima="${ult ? ult.kg : ''}" placeholder="${ult ? kgTesto(ult.kg) : 'kg'}" aria-label="kg ${esc(e.nome)}">
              <button type="button" data-passo="${passo}" aria-label="più">+</button><span>kg</span></span></div>`;
          }).join('')}</div>`).join('')}
        <button class="bottone" id="pesi-salva">Salva allenamento</button>
        <div class="msg" id="pesi-msg"></div>
        <p class="palestra-piede">Scrivi solo gli esercizi che hai fatto: quelli vuoti non vengono salvati. Ogni salvataggio si aggiunge ai precedenti.</p>
      </div>`;
    box.querySelector('[data-esci]').onclick = esci;
    box.querySelectorAll('[data-sp]').forEach(b => b.onclick = () => { schedaPesi = b.dataset.sp; disegnaPesi(); });
    box.querySelectorAll('[data-passo]').forEach(b => b.onclick = () => {
      const inp = b.parentNode.querySelector('input');
      const base = inp.value !== '' ? Number(inp.value.replace(',', '.')) : Number(inp.dataset.ultima || 0);
      inp.value = kgTesto(Math.max(0, (isFinite(base) ? base : 0) + Number(b.dataset.passo)));
    });
    const msg = box.querySelector('#pesi-msg');
    box.querySelector('#pesi-salva').onclick = async (ev) => {
      msg.className = 'msg err'; msg.textContent = '';
      const voci = [];
      for (const inp of box.querySelectorAll('input[data-chiave]')) {
        const v = inp.value.trim(); if (v === '') continue;
        const kg = Number(v.replace(',', '.'));
        if (!isFinite(kg) || kg < 0 || kg > 500) { msg.textContent = 'Controlla il peso di ' + inp.dataset.nome; inp.focus(); return; }
        voci.push({ chiave: inp.dataset.chiave, esercizio: inp.dataset.nome, kg });
      }
      if (!voci.length) { msg.textContent = 'Scrivi almeno un peso'; return; }
      const giorno = box.querySelector('#pesi-data').value || OGGI;
      ev.target.disabled = true; ev.target.textContent = 'Salvataggio…';
      try {
        const r = await chiama({ azione: 'salva', atleta: utente.atleta, pin: utente.pin, data: giorno,
          programma: PALESTRA.programma.id, scheda: sc.titolo, voci });
        if (!r.ok) throw new Error(r.errore);
        for (const v of voci) storico.push({ data: giorno, programma: PALESTRA.programma.id, scheda: sc.titolo, ...v });
        await disegnaPesi();
        const m = document.getElementById('pesi-msg');
        m.className = 'msg ok'; m.textContent = `Salvato: ${voci.length} ${voci.length === 1 ? 'esercizio' : 'esercizi'}. Li trovi in Andamento.`;
      } catch (e) {
        msg.textContent = e.message || 'Non riesco a salvare. Controlla la connessione e riprova.';
        ev.target.disabled = false; ev.target.textContent = 'Salva allenamento';
      }
    };
  }

  // Pagina "Andamento"
  async function disegnaAndamento() {
    const box = document.getElementById('pag-andamento');
    if (!await preparaUtente(box)) return;
    // esercizi del programma attuale: chiave → {nome, blocco}
    const attuali = {};
    for (const sc of PALESTRA.schede) for (const b of sc.blocchi) for (const e of b.esercizi) if (e.carico) attuali[e.chiave] ??= { nome: e.nome, blocco: b.nome };
    // raggruppa per esercizio; se nello stesso giorno ci sono più righe vale l'ultima
    const gruppi = {};
    for (const r of storico) {
      const g = gruppi[r.chiave] ??= { chiave: r.chiave, nome: r.esercizio, giorni: {} };
      g.giorni[r.data] = r; g.nome = attuali[r.chiave]?.nome || r.esercizio;
    }
    const lista = Object.values(gruppi).map(g => {
      const voci = Object.values(g.giorni).sort((a, b) => a.data.localeCompare(b.data));
      return { ...g, voci, ultimo: voci[voci.length - 1], primo: voci[0], record: Math.max(...voci.map(v => v.kg)) };
    }).sort((a, b) => (!!attuali[b.chiave] - !!attuali[a.chiave]) || b.ultimo.data.localeCompare(a.ultimo.data));

    if (!lista.length) {
      box.innerHTML = intestazione() + `<div class="riquadro"><h2>Ancora niente</h2><div style="color:var(--grigio)">Quando salvi i pesi in "I miei pesi", qui vedi come vanno esercizio per esercizio.</div></div>`;
      box.querySelector('[data-esci]').onclick = esci; return;
    }
    const grafico = (voci, c) => {
      if (voci.length < 2) return '';
      const W = 300, H = 44, kg = voci.map(v => v.kg), lo = Math.min(...kg), hi = Math.max(...kg), sp = hi - lo || 1;
      const pt = voci.map((v, i) => [4 + i * (W - 8) / (voci.length - 1), H - 6 - (v.kg - lo) / sp * (H - 12)]);
      return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pt.map(p => p.map(n => n.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="${c}" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
        <circle cx="${pt[pt.length - 1][0]}" cy="${pt[pt.length - 1][1]}" r="3.5" fill="${c}"/></svg>`;
    };
    box.innerHTML = intestazione() + lista.map(g => {
      const att = attuali[g.chiave], c = att ? coloreBlocco(att.blocco) : '#9aa4b5';
      const volte = g.voci.length;
      return `<div class="andamento-es" style="--c:${c}" data-k="${esc(g.chiave)}">
        <div class="testa"><b>${esc(g.nome)}</b>${att ? `<span class="num">${volte > 1 ? kgTesto(g.primo.kg) + ' → ' : ''}<strong>${kgTesto(g.ultimo.kg)} kg</strong></span>` : '<span class="vecchio">programma precedente</span>'}</div>
        <div class="info">${volte} ${volte === 1 ? 'volta' : 'volte'} · record ${kgTesto(g.record)} kg · ultima ${dataBreve(g.ultimo.data)}</div>
        ${grafico(g.voci, c)}
        ${aperti.has(g.chiave) ? `<div class="storia">${g.voci.slice().reverse().map(v => `<div><span>${dataBreve(v.data)}${v.programma && v.programma !== PALESTRA.programma.id ? '<em>programma precedente</em>' : ''}</span><span>${kgTesto(v.kg)} kg</span></div>`).join('')}</div>` : ''}
      </div>`;
    }).join('') + '<p class="palestra-piede">Tocca un esercizio per vedere tutte le volte.</p>';
    box.querySelector('[data-esci]').onclick = esci;
    box.querySelectorAll('.andamento-es').forEach(el => el.onclick = () => {
      const k = el.dataset.k; aperti.has(k) ? aperti.delete(k) : aperti.add(k); disegnaAndamento();
    });
  }
  if (PESI_URL) document.querySelectorAll('.pagine a[hidden]').forEach(a => a.hidden = false);

  disegnaPalestra();
  mostraPagina();
  disegnaProssimo();
  disegna();
</script>
</body>
</html>
